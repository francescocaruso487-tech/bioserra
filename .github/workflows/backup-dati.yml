name: BioSerra - Backup Dati Settimanale

on:
  schedule:
    - cron: '45 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Crea tag di backup settimanale su main
        env:
          GH_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: |
          SHA=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/main" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")
          TAG="data-backup-$(date -u +%Y-%m-%d)"
          echo "Creo tag $TAG sul commit $SHA"

          HTTP_CODE=$(curl -s -o /tmp/tagresp.json -w "%{http_code}" \
            -X POST -H "Authorization: token ${GH_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${SHA}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs")

          if [ "$HTTP_CODE" == "201" ]; then
            echo "Tag $TAG creato con successo."
            echo "### ✅ Backup settimanale" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag \`${TAG}\` creato su commit \`${SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Errore creazione tag (HTTP $HTTP_CODE):"
            cat /tmp/tagresp.json
            echo "### ⚠️ Backup fallito" >> "$GITHUB_STEP_SUMMARY"
            echo "Errore HTTP $HTTP_CODE nella creazione del tag." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
