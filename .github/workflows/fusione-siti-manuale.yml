name: fusione-siti-manuale

on:
  workflow_dispatch:

jobs:
  fusione:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fusione testi per categoria
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: python .github/scripts/fusione_siti.py
