name: BioSerra - Wiki Update

on:
  schedule:
    - cron: '0 6 * * 0'   # domenica 06:00 UTC (dopo guide-update alle 05:00)
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wiki Update con Mistral
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/wiki_update.py
