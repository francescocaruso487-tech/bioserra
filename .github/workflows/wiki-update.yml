name: BioSerra - Wiki Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wiki Update con Mistral
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/wiki_update.py
