name: BioSerra - Guide Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guide Update con Mistral
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/guide_update.py
