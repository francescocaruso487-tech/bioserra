name: BioSerra - Concetti Index

on:
  schedule:
    - cron: '0 3 * * *'  # ogni notte 03:00 UTC (05:00 ora italiana)
  workflow_dispatch:

jobs:
  concetti:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera concetti index con Mistral
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/concetti_index.py

