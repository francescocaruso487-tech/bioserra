name: BioSerra - Test Groq
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Mistral Chat
        env:
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: python3 .github/scripts/test_groq_full.py
