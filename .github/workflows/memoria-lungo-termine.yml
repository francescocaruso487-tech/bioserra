name: BioSerra - Memoria Lungo Termine

on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:

jobs:
  memoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Distilla memoria a lungo termine con Mistral
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/memoria_lungo_termine.py
