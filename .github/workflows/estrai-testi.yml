name: BioSerra - Estrai Testi PDF

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  estrai:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Installa Tesseract OCR + Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita poppler-utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze Python
        run: |
          pip install pymupdf --quiet || echo "pymupdf skip"
          pip install pdfplumber --quiet
          pip install pypdf --quiet
          pip install pytesseract pillow pdf2image --quiet || echo "pytesseract skip"

      - name: Verifica ambiente
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: |
          echo "GITHUB_TOKEN presente: $([ -n "$GITHUB_TOKEN" ] && echo SI || echo NO)"
          python3 -c "import pdfplumber; print('pdfplumber OK')"
          python3 -c "import fitz; print('fitz OK')" || echo "fitz non disponibile"
          python3 -c "import os; print('TOKEN len:', len(os.environ.get('GITHUB_TOKEN','')))"

      - name: Estrai testi da PDF (OCR completo)
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: python3 .github/scripts/estrai_testi.py
