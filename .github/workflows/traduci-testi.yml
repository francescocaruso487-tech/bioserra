name: traduci-testi

on:
  schedule:
    # 01:30 UTC — dopo estrai (00:00) e classifica (00:30), prima di analisi (02:00)
    - cron: '30 1 * * *'
  workflow_dispatch:

# Rev.27: stesso concurrency group dei writer di pdf_knowledge.json (vedi analisi-pdf).
concurrency:
  group: bioserra-pdf-knowledge
  cancel-in-progress: false

jobs:
  traduci:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Traduci testi non italiani
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python .github/scripts/traduci_testi.py
