name: BioSerra - Analisi PDF

on:
  schedule:
    - cron: '0 1 * * *'  # ogni notte 01:00 UTC (03:00 ora italiana)
  workflow_dispatch:       # lancio manuale

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analisi PDF con Groq
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python3 .github/scripts/analisi_pdf.py
