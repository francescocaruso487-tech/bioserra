name: BioSerra - Analisi PDF

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Installa Tesseract OCR + Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita poppler-utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analisi PDF con Mistral + OCR
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/analisi_pdf.py

