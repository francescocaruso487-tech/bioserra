name: BioSerra - Analisi PDF

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Groq API
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python3 .github/scripts/test_groq.py

      - name: Analisi PDF (pymupdf + Groq)
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python3 .github/scripts/analisi_pdf.py
