name: Piante Stato Update

on:
  schedule:
    # 03:30 UTC = 05:30 ora italiana — prima di brain-update (04:00 UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run piante_stato_update
        env:
          BIOSERRA_GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
        run: python .github/scripts/piante_stato_update.py
