name: BioSerra - Embedding PDF Mistral

on:
  schedule:
    - cron: '0 2 * * *'  # ogni notte 02:00 UTC (04:00 ora italiana)
  workflow_dispatch:

jobs:
  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera embeddings Mistral
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python3 .github/scripts/embedding_pdf.py
