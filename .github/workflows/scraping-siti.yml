name: scraping-siti

on:
  schedule:
    - cron: "0 23 * * 0"   # Ogni domenica alle 23:00 UTC
  workflow_dispatch:         # Avvio manuale

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraping
        env:
          GITHUB_TOKEN: ${{ secrets.BIOSERRA_GITHUB_TOKEN }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python .github/scripts/scraping_siti.py

